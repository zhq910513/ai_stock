[project]
name = "ai-stock-source-data-service"
version = "0.1.0"
description = "Raw-interface first source data service for Shence Center ai_stock"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",
  "requests>=2.31,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
providers = [
  "baostock>=0.8.9",
  "akshare>=1.16",
  "tushare>=1.4",
]
