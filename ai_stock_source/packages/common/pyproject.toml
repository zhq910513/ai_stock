[project]
name = "ai-stock-common"
version = "0.1.0"
description = "Shared lightweight utilities for ai_stock services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
