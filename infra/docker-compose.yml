      AI_STOCK_DATABASE_URL: ${AI_STOCK_DATABASE_URL:-postgresql://${POSTGRES_USER:-ai_stock}:${POSTGRES_PASSWORD:-ai_stock}@postgres:5432/${POSTGRES_DB:-ai_stock}}
      SOURCE_DATA_SERVICE_BASE_URL: http://source-data-service:8041
      SERVICE_NAME: research-service
      PORT: 8029
    depends_on:
      postgres:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
      source-data-service:
        condition: service_healthy
    command: ["uvicorn", "research_service.main:app", "--host", "0.0.0.0", "--port", "8029"]
    ports:
      - "${RESEARCH_SERVICE_PORT:-8029}:8029"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8029/readyz', timeout=3).read()\""]
