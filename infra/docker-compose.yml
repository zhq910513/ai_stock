      AI_STOCK_DATABASE_URL: ${AI_STOCK_DATABASE_URL:-postgresql://${POSTGRES_USER:-ai_stock}:${POSTGRES_PASSWORD:-ai_stock}@postgres:5432/${POSTGRES_DB:-ai_stock}}
      SOURCE_DATA_SERVICE_BASE_URL: http://source-data-service:8041
      SCHEDULER_SERVICE_BASE_URL: http://scheduler-service:8023
      HOT_CANDIDATES_SERVICE_BASE_URL: http://hot-candidates-service:8031
      CANDIDATE_MEMORY_SERVICE_BASE_URL: http://candidate-memory-service:8032
      AMBUSH_WATCHLIST_SERVICE_BASE_URL: http://ambush-watchlist-service:8033
      T_BOARD_RELAY_SERVICE_BASE_URL: http://t-board-relay-service:8034
      DATA_INSPECTOR_REQUIRED_MODEL_SERVICES: ${DATA_INSPECTOR_REQUIRED_MODEL_SERVICES:-none}
      T_BOARD_DEFAULT_SYMBOL: ${T_BOARD_DEFAULT_SYMBOL:-000759.SZ}
      SERVICE_NAME: data-inspector-service
      PORT: 8025
    depends_on:
      postgres:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
      source-data-service:
        condition: service_healthy
    command: ["uvicorn", "data_inspector_service.main:app", "--host", "0.0.0.0", "--port", "8025"]
    ports:
      - "${DATA_INSPECTOR_SERVICE_PORT:-8025}:8025"
    healthcheck:
