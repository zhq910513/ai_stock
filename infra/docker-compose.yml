  hot-candidates-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_DIR: services/models_services/hot-candidates-service
    container_name: ai-stock-hot-candidates-service
    environment:
      AI_STOCK_DATABASE_URL: ${AI_STOCK_DATABASE_URL:-postgresql://${POSTGRES_USER:-ai_stock}:${POSTGRES_PASSWORD:-ai_stock}@postgres:5432/${POSTGRES_DB:-ai_stock}}
      SOURCE_DATA_SERVICE_BASE_URL: http://source-data-service:8041
      SERVICE_NAME: hot-candidates-service
      PORT: 8031
    depends_on:
      postgres:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
      source-data-service:
        condition: service_healthy
    command: ["uvicorn", "hot_candidates_model_service.main:app", "--host", "0.0.0.0", "--port", "8031"]
    ports:
      - "${HOT_CANDIDATES_SERVICE_PORT:-8031}:8031"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/readyz', timeout=3).read()\""]
