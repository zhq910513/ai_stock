# Market-data provider source catalog.
# Non-sensitive only: store env var names, never token/password values.

catalog_version = "market_data_source_catalog_v1"
owner_service = "market-data-service"

[guardrails]
secret_values_forbidden = true
new_adapter_requires_real_probe = true
converter_required_before_canonical_write = true
raw_payload_lineage_required = true
historical_backfill_must_be_marked_replay_safe = true
decision_time_confidence_must_not_use_future_or_replay_data = true
jarvis_may_observe_and_recommend = true
jarvis_may_mutate_provider_facts = false
jarvis_may_change_data_confidence = false

[access_tiers.free_public_unofficial]
label = "Free public / unofficial"
cost_model = "free"
officiality = "public web or undocumented endpoint"
sla = "none"
production_boundary = "Allowed only after real probe, converter, raw lineage, and source-health contract exist."

[access_tiers.free_public_official]
label = "Free public / official"
cost_model = "free_or_free_limited"
officiality = "official public API or documented public endpoint"
sla = "best_effort_or_public_quota"
production_boundary = "Allowed after real probe and converter; quota and attribution must remain visible."

[access_tiers.quasi_official_points]
label = "Quasi-official / points or account gated"
cost_model = "points_quota_or_account_gated"
officiality = "documented data platform, not exchange-authoritative"
sla = "platform_terms"
production_boundary = "Good candidate for historical backfill when token/account, probe artifact, and converter are present."

[access_tiers.commercial_licensed]
label = "Commercial licensed"
cost_model = "paid_contract"
officiality = "contractual vendor"
sla = "license_sla"
production_boundary = "Preferred for production-grade historical replay after license scope, probe, and converter are verified."

[providers.eastmoney]
display_name = "Eastmoney public web/DataCenter"
access_tier = "free_public_unofficial"
implemented = true
auth_required = false
env_keys = []
supported_modes = ["current_session", "after_close_target_day_backfill", "recent_historical_backfill"]
decision_role = "primary_or_context_source_after_probe"
historical_backfill_role = "limited_by_endpoint_window_and_probe_result"
contract_status = "active_verified_adapters"
domains = ["quote", "auction", "daily_bar", "minute_bar", "moneyflow", "board_context", "northbound", "macro_lpr", "billboard"]
